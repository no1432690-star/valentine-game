<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You Be My Valentine? 💘</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #ff758c;
            --secondary-pink: #ff7eb3;
            --dark-text: #4a4a4a;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.9);
            
            /* Ending Themes */
            --theme-1-bg: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --theme-2-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --theme-3-bg: #1a1a1a;
            --theme-4-bg: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: manipulation; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(120deg, #a18cd1 0%, #fbc2eb 100%);
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* Particles */
        #particles-container { position: absolute; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .heart-particle { position: absolute; animation: floatUp linear infinite; }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Top Controls */
        .top-controls { position: absolute; top: 20px; right: 20px; z-index: 500; display: flex; gap: 10px; }
        .ui-btn {
            background: rgba(255,255,255,0.6); border: 1px solid white;
            padding: 8px 15px; border-radius: 20px; cursor: pointer;
            font-family: 'Fredoka', sans-serif; color: #555;
            transition: 0.2s; backdrop-filter: blur(4px);
        }
        .ui-btn:hover { background: white; transform: translateY(-2px); }

        /* --- GAME CONTAINER --- */
        .game-container { position: relative; z-index: 10; width: 95%; max-width: 480px; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border); border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            transition: opacity 0.3s;
        }

        /* --- STATS BARS (UPDATED) --- */
        .stats-container { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .stat-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #666; font-weight: 700; }
        .stat-label { width: 60px; text-align: right; cursor: pointer; } /* YES clickable here */
        .progress-track { flex-grow: 1; height: 10px; background: rgba(0,0,0,0.1); border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .stat-val { width: 50px; text-align: left; font-family: 'Fredoka', monospace; }

        #bar-yes { background: linear-gradient(90deg, #ff9a9e, #ff758c); }
        #bar-no { background: linear-gradient(90deg, #a18cd1, #bc4e9c); }
        #bar-choice { background: linear-gradient(90deg, #fbc2eb, #a6c1ee); }

        /* Main Game Elements */
        .title { font-family: 'Fredoka', cursive; color: var(--primary-pink); font-size: 2rem; margin-bottom: 10px; line-height: 1.1; }
        .dialogue-box { min-height: 50px; margin-bottom: 20px; color: #555; font-style: italic; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        
        .button-area { position: relative; height: 280px; width: 100%; display: flex; justify-content: center; gap: 20px; padding-top: 10px; }
        .game-btn {
            font-family: 'Fredoka', sans-serif; font-size: 1.2rem;
            padding: 12px 32px; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.2s; position: relative; z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-yes { background: linear-gradient(45deg, #ff758c, #ff7eb3); color: white; }
        .btn-no { background: #e0e0e0; color: #666; }
        .btn-yes:active, .btn-no:active { transform: scale(0.95); }

        /* Clone/Effect Container */
        #fake-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; overflow: hidden; border-radius: 10px; }
        .fake-btn { position: absolute; pointer-events: auto; opacity: 0.9; }

        /* --- ENDING OVERLAY (SHARED) --- */
        #ending-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000; opacity: 0; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
            color: white; padding: 20px;
            text-align: center;
        }
        #ending-overlay.visible { opacity: 1; pointer-events: auto; }
        
        /* Themes */
        .theme-1 { background: var(--theme-1-bg); }
        .theme-2 { background: var(--theme-2-bg); }
        .theme-3 { background: var(--theme-3-bg); }
        .theme-4 { background: var(--theme-4-bg); }

        .ending-content { max-width: 500px; width: 100%; }
        .ending-title { font-family: 'Fredoka', cursive; font-size: 3rem; margin-bottom: 5px; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .ending-sub { font-size: 1rem; opacity: 0.8; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }
        
        .cinematic-text {
            font-family: 'Nunito', sans-serif; font-size: 1.3rem; min-height: 120px;
            background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px;
            margin-bottom: 30px; display: flex; align-items: center; justify-content: center;
            line-height: 1.5; cursor: pointer;
        }

        .ending-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .end-btn {
            background: rgba(255,255,255,0.2); border: 2px solid white; color: white;
            padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: bold;
            transition: 0.2s; font-size: 1rem;
        }
        .end-btn:hover { background: white; color: #333; }

        /* --- ENDING 3: ROOM SCENE --- */
        #room-scene {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d0d0d; z-index: 1500;
            display: none; opacity: 0; transition: opacity 1.5s;
            overflow: hidden;
            font-family: 'VT323', monospace; /* Pixel/Horror font */
        }
        #room-scene.visible { display: block; opacity: 1; pointer-events: auto; }
        
        .room-bg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; height: 100%; max-width: 800px;
            background: radial-gradient(circle at 70% 30%, #2a2a2a 0%, #000000 80%);
        }
        
        /* Objects */
        .room-obj { position: absolute; cursor: pointer; transition: 0.3s; font-size: 3rem; filter: grayscale(0.6); }
        .room-obj:hover { filter: grayscale(0) drop-shadow(0 0 10px rgba(255,255,255,0.3)); transform: scale(1.05); }
        
        #obj-tulip { bottom: 20%; left: 20%; } /* Tulip */
        #obj-letter { bottom: 35%; left: 45%; font-size: 2.5rem; } /* Letter on bed */
        #obj-diary { bottom: 25%; right: 25%; } /* Diary on table */
        #obj-window { top: 15%; right: 15%; font-size: 4rem; opacity: 0.7; }
        #obj-lamp { bottom: 35%; right: 15%; font-size: 2.5rem; color: #fdcb6e; }

        /* Room UI */
        #room-tooltip {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #ccc; padding: 10px 20px;
            border-radius: 5px; font-size: 1.2rem; pointer-events: none; opacity: 0; transition: 0.3s;
        }
        #room-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 400px; background: #111; border: 1px solid #444;
            padding: 20px; color: #eee; text-align: center; display: none;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        #room-modal-text { font-size: 1.4rem; min-height: 80px; margin-bottom: 20px; }
        .room-close-btn { background: #333; color: white; border: 1px solid #666; padding: 5px 15px; cursor: pointer; }

        /* --- SECRET MODAL (ENDING 4) --- */
        #secret-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2500;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.5s;
        }
        #secret-modal.visible { opacity: 1; pointer-events: auto; }
        .secret-btn {
            font-size: 2rem; padding: 15px 40px; margin-top: 30px;
            background: gold; color: black; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 0 20px gold; animation: pulse 1s infinite;
        }

        /* Helpers */
        .hidden { display: none !important; }
        .visible { display: flex !important; }
        
        /* Start Overlay */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            z-index: 3000; display: flex; align-items: center; justify-content: center;
        }
        .start-btn {
            font-size: 2rem; padding: 20px 40px; border-radius: 50px;
            border: 4px solid white; background: rgba(255,255,255,0.3); color: white;
            cursor: pointer; font-family: 'Fredoka', cursive; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- AUDIO -->
    <audio id="bgm-game" loop></audio>
    <audio id="bgm-end" loop></audio>

    <!-- BACKGROUND -->
    <div id="particles-container"></div>

    <!-- UI -->
    <div class="top-controls">
        <button id="btn-lobby-back" class="ui-btn hidden">🏠 Lobby</button>
        <button id="btn-reset" class="ui-btn">↻ Reset</button>
    </div>

    <!-- MAIN GAMEPLAY -->
    <div class="game-container" id="game-view">
        <div class="glass-card" id="main-card">
            
            <!-- PROGRESS STATS -->
            <div class="stats-container">
                <!-- YES BAR -->
                <div class="stat-row">
                    <div class="stat-label" id="lbl-yes-trigger">YES</div>
                    <div class="progress-track"><div class="progress-bar" id="bar-yes"></div></div>
                    <div class="stat-val" id="val-yes">00/101</div>
                </div>
                <!-- NO BAR -->
                <div class="stat-row">
                    <div class="stat-label">NO</div>
                    <div class="progress-track"><div class="progress-bar" id="bar-no"></div></div>
                    <div class="stat-val" id="val-no">00/100</div>
                </div>
                <!-- CHOICE BAR -->
                <div class="stat-row">
                    <div class="stat-label">CHOICE</div>
                    <div class="progress-track"><div class="progress-bar" id="bar-choice"></div></div>
                    <div class="stat-val" id="val-choice">00/101</div>
                </div>
            </div>

            <!-- CONTENT -->
            <h1 class="title">Will you be my valentine? 💘</h1>
            <div class="dialogue-box"><p id="dialogue-text">Please say yes! 🥺</p></div>

            <!-- BUTTONS -->
            <div class="button-area" id="button-area">
                <button id="btn-yes" class="game-btn btn-yes">YES 💖</button>
                <button id="btn-no" class="game-btn btn-no">NO 💔</button>
                <div id="fake-container"></div>
            </div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-overlay">
        <button id="btn-start" class="start-btn">Tap to Start 💘</button>
    </div>

    <!-- ENDING OVERLAY (Generic for Ending 1, 2, 4) -->
    <div id="ending-overlay">
        <div class="ending-content">
            <h1 class="ending-title" id="end-title">TRUE LOVE</h1>
            <p class="ending-sub" id="end-sub">YES: 101/101</p>
            
            <div class="cinematic-text" id="end-text">
                <!-- Typewriter text goes here -->
            </div>

            <div class="ending-actions">
                <button class="end-btn" id="btn-end-replay">↻ Replay</button>
                <button class="end-btn" id="btn-end-lobby">🏠 Lobby</button>
                <button class="end-btn" id="btn-end-share">💌 Share</button>
            </div>
        </div>
        <canvas id="confetti-canvas"></canvas>
    </div>

    <!-- ENDING 3: THE ROOM SCENE -->
    <div id="room-scene">
        <div class="room-bg">
            <!-- Decorative -->
            <div class="room-obj" id="obj-window" title="Window">🪟</div>
            <div class="room-obj" id="obj-lamp" title="Lamp">🏮</div>
            
            <!-- Interactive -->
            <div class="room-obj" id="obj-tulip" title="Tulip">🌷</div>
            <div class="room-obj" id="obj-letter" title="Letter">✉️</div>
            <div class="room-obj" id="obj-diary" title="Diary">📓</div>
        </div>
        <div id="room-tooltip">A tulip...</div>
        
        <!-- Room Item Modal -->
        <div id="room-modal">
            <div id="room-modal-text"></div>
            <button class="room-close-btn" id="btn-room-close">Close</button>
        </div>
    </div>

    <!-- ENDING 4: SECRET QUESTION -->
    <div id="secret-modal">
        <h1 style="color:white; font-family:'Fredoka';">One last question...</h1>
        <div class="cinematic-text" id="secret-text" style="color:white; font-size: 1.5rem; margin:20px;"></div>
        <button id="btn-secret-yes" class="secret-btn">YES</button>
    </div>

    <script>
        /* --- CONFIG & STATE --- */
        const CONFIG = {
            YES_GOAL: 101,
            NO_GOAL: 100,
            STORAGE_KEY: 'v_game_save_v2'
        };

        const STATE = {
            yesCount: 0,
            noCount: 0,
            scoreClicked: false,
            isEnding: false,
            currentEnding: 0, // 0=none, 1=True, 2=Hesitant, 3=Room, 4=Secret
            roomProgress: { tulip: false, letter: false, diary: false }
        };

        const ENDING_DATA = {
            1: {
                id: 1, title: "TRUE LOVE", subtitle: "YES: 101/101", theme: "theme-1",
                text: ["101 times...", "You didn't hesitate.", "You chose me...", "over and over again.", "Maybe...", "true love...", "is just that simple."]
            },
            2: {
                id: 2, title: "HESITANT HEART", subtitle: "YES: 51 - NO: 50", theme: "theme-2",
                text: ["You said 'NO'...", "so many times I thought...", "I would disappear.", "But in the end...", "you still chose 'YES'.", "Even once more...", "is enough.", "Thank you for coming back."]
            },
            4: {
                id: 4, title: "THE SECRET YES", subtitle: "SECRET ENDING FOUND", theme: "theme-4",
                text: ["You found the secret.", "Not just the game's secret...", "but mine.", "You proved that...", "I am worth choosing.", "This Valentine...", "I am yours."]
            }
        };

        /* --- DOM ELEMENTS --- */
        const DOM = {
            gameView: document.getElementById('game-view'),
            mainCard: document.getElementById('main-card'),
            yesBtn: document.getElementById('btn-yes'),
            noBtn: document.getElementById('btn-no'),
            dialogue: document.getElementById('dialogue-text'),
            
            // Stats
            lblYes: document.getElementById('lbl-yes-trigger'),
            barYes: document.getElementById('bar-yes'),
            barNo: document.getElementById('bar-no'),
            barChoice: document.getElementById('bar-choice'),
            valYes: document.getElementById('val-yes'),
            valNo: document.getElementById('val-no'),
            valChoice: document.getElementById('val-choice'),

            // Overlays
            startOverlay: document.getElementById('start-overlay'),
            endingOverlay: document.getElementById('ending-overlay'),
            roomScene: document.getElementById('room-scene'),
            secretModal: document.getElementById('secret-modal'),

            // Ending UI
            endTitle: document.getElementById('end-title'),
            endSub: document.getElementById('end-sub'),
            endText: document.getElementById('end-text'),
            
            // Audio
            bgmGame: document.getElementById('bgm-game'),
            bgmEnd: document.getElementById('bgm-end')
        };

        /* --- AUDIO MANAGER --- */
        const AudioMgr = {
            init() {
                // Try to load default placeholder paths. 
                // Add ?v=2 to bust cache as requested previously
                DOM.bgmGame.src = 'music/lobby.mp3?v=2'; 
                DOM.bgmGame.volume = 0.4;
                DOM.bgmEnd.volume = 0.5;
            },
            playGame() {
                if(DOM.bgmGame.paused) DOM.bgmGame.play().catch(()=>{});
            },
            playEnding(id) {
                DOM.bgmGame.pause();
                let src = '';
                if(id === 1) src = 'music/victory_love.mp3?v=2';
                if(id === 2) src = 'music/ending_bittersweet.mp3?v=2';
                if(id === 4) src = 'music/music_box.mp3?v=2';
                
                if(src) {
                    DOM.bgmEnd.src = src;
                    DOM.bgmEnd.play().catch(()=>{});
                }
            },
            stopAll() {
                DOM.bgmGame.pause();
                DOM.bgmEnd.pause();
            }
        };

        /* --- GAME LOGIC --- */

        function init() {
            AudioMgr.init();
            resetGameUI();
            
            document.getElementById('btn-start').onclick = () => {
                DOM.startOverlay.classList.add('hidden');
                AudioMgr.playGame();
            };
            
            // Score Click Easter Egg
            DOM.lblYes.onclick = () => {
                if(!STATE.scoreClicked) {
                    STATE.scoreClicked = true;
                    showTooltip("Something sparkled... ✨");
                    DOM.lblYes.style.color = "gold";
                    DOM.lblYes.style.textShadow = "0 0 5px gold";
                }
            };
            
            // Button handlers
            DOM.yesBtn.onpointerdown = handleYes;
            DOM.noBtn.onpointerdown = handleNo;
            
            // Global Buttons
            document.getElementById('btn-reset').onclick = resetGame;
            document.getElementById('btn-end-replay').onclick = resetGame;
            document.getElementById('btn-end-lobby').onclick = () => location.reload();
            document.getElementById('btn-end-share').onclick = () => alert("Share Card coming soon! 💌");
        }

        function handleYes() {
            if(STATE.isEnding) return;
            
            STATE.yesCount++;
            updateUI();
            
            // Check Endings
            checkEndings();
            
            // Effects
            createParticle();
            if(!STATE.isEnding) DOM.dialogue.innerText = getRandomDialogue();
        }

        function handleNo() {
            if(STATE.isEnding) return;
            
            STATE.noCount++;
            updateUI();
            
            checkEndings();
            
            // Shake Effect
            DOM.mainCard.classList.remove('shake');
            void DOM.mainCard.offsetWidth;
            DOM.mainCard.classList.add('shake');
            DOM.dialogue.innerText = "Don't break my heart... 💔";
        }

        function updateUI() {
            // Format 01/101
            const fmt = (n) => n.toString().padStart(2, '0');
            
            DOM.valYes.innerText = `${fmt(STATE.yesCount)}/${CONFIG.YES_GOAL}`;
            DOM.valNo.innerText = `${fmt(STATE.noCount)}/${CONFIG.NO_GOAL}`;
            
            const total = STATE.yesCount + STATE.noCount;
            // Choice goal logic: just showing progress relative to YES goal for leading
            DOM.valChoice.innerText = `${fmt(total)}/${CONFIG.YES_GOAL}`;

            // Widths
            DOM.barYes.style.width = Math.min((STATE.yesCount / CONFIG.YES_GOAL) * 100, 100) + '%';
            DOM.barNo.style.width = Math.min((STATE.noCount / CONFIG.NO_GOAL) * 100, 100) + '%';
            DOM.barChoice.style.width = Math.min((total / CONFIG.YES_GOAL) * 100, 100) + '%';
        }

        function checkEndings() {
            // ENDING 4 CHECK (Before Ending 1)
            if (STATE.yesCount === 100 && STATE.scoreClicked) {
                triggerSecretQuestion();
                return;
            }

            // ENDING 1: TRUE LOVE
            if (STATE.yesCount >= CONFIG.YES_GOAL) {
                enterEnding(1);
                return;
            }

            // ENDING 2: HESITANT HEART
            if (STATE.yesCount === 51 && STATE.noCount === 50) {
                enterEnding(2);
                return;
            }

            // ENDING 3: EMPTY ROOM
            if (STATE.noCount >= CONFIG.NO_GOAL) {
                enterEnding(3);
                return;
            }
        }

        /* --- ENDING LOGIC --- */

        function enterEnding(id) {
            STATE.isEnding = true;
            STATE.currentEnding = id;
            
            // Disable Game UI
            DOM.gameView.style.opacity = '0';
            DOM.gameView.style.pointerEvents = 'none';

            if (id === 3) {
                // Room Scene Logic
                AudioMgr.stopAll(); // Silence for room
                setTimeout(() => {
                    DOM.roomScene.classList.add('visible');
                    initRoomScene();
                }, 1000);
            } else {
                // Standard Overlay Logic (1, 2, 4)
                AudioMgr.playEnding(id);
                renderEndingOverlay(id);
            }
        }

        function renderEndingOverlay(id) {
            const data = ENDING_DATA[id];
            DOM.endingOverlay.className = data.theme; // Set Theme Class
            DOM.endTitle.innerText = data.title;
            DOM.endSub.innerText = data.subtitle;
            
            DOM.endingOverlay.classList.add('visible');
            
            // Start Typewriter
            startTypewriter(data.text);
            
            if(id === 1 || id === 4) startConfetti();
        }

        /* --- ENDING 4: SECRET MECHANIC --- */
        function triggerSecretQuestion() {
            STATE.isEnding = true; // Temporary lock
            DOM.secretModal.classList.add('visible');
            
            const qLines = ["You think this is enough?", "If you truly want it...", "Say YES one last time."];
            let qIdx = 0;
            const qEl = document.getElementById('secret-text');
            
            function nextQ() {
                if(qIdx < qLines.length) {
                    qEl.innerText = qLines[qIdx++];
                    qEl.style.opacity = 0;
                    setTimeout(() => qEl.style.opacity = 1, 100);
                    setTimeout(nextQ, 1500);
                } else {
                    document.getElementById('btn-secret-yes').style.display = 'block';
                }
            }
            document.getElementById('btn-secret-yes').style.display = 'none';
            nextQ();

            document.getElementById('btn-secret-yes').onclick = () => {
                DOM.secretModal.classList.remove('visible');
                enterEnding(4);
            };
        }

        /* --- ENDING 3: ROOM INTERACTION --- */
        function initRoomScene() {
            const toolTip = document.getElementById('room-tooltip');
            const modal = document.getElementById('room-modal');
            const mText = document.getElementById('room-modal-text');
            
            // Helper to handle object clicks
            const setupObj = (id, flavorText, isKeyObj, keyName) => {
                const el = document.getElementById(id);
                el.onclick = () => {
                    if(isKeyObj) {
                        STATE.roomProgress[keyName] = true;
                        // Show modal
                        mText.innerHTML = ""; // Clear
                        modal.style.display = 'block';
                        
                        // Simple typewriter for modal
                        let txt = flavorText; // Assume string array or string
                        if(Array.isArray(txt)) txt = txt.join("<br><br>");
                        mText.innerHTML = txt;
                        
                        checkRoomCompletion();
                    } else {
                        // Just tooltip
                        toolTip.innerText = flavorText;
                        toolTip.style.opacity = 1;
                        setTimeout(()=> toolTip.style.opacity = 0, 2000);
                    }
                };
            };

            setupObj('obj-window', "The moon is cold tonight.", false);
            setupObj('obj-lamp', "A fading light...", false);
            
            setupObj('obj-tulip', ["Tulip.", "The flower of deep love.", "But this one is fake.", "It never lived."], true, 'tulip');
            
            setupObj('obj-letter', ["I wrote it...", "tore it...", "wrote it again.", "Scared of one 'NO'.", "You gave me 100."], true, 'letter');
            
            setupObj('obj-diary', ["Page 1: I saw you today...", "Page 2: I wanted to ask...", "Page 3: The answer existed before the question."], true, 'diary');
            
            document.getElementById('btn-room-close').onclick = () => {
                modal.style.display = 'none';
            };
        }

        function checkRoomCompletion() {
            const p = STATE.roomProgress;
            if(p.tulip && p.letter && p.diary) {
                setTimeout(() => {
                    // Transition to final text
                    DOM.roomScene.style.opacity = 0;
                    setTimeout(() => {
                        DOM.roomScene.style.display = 'none';
                        // Reuse generic overlay logic manually for Ending 3 final state
                        AudioMgr.stopAll();
                        DOM.endingOverlay.className = 'theme-3';
                        DOM.endTitle.innerText = "THE EMPTY ROOM";
                        DOM.endSub.innerText = "NO: 100/100";
                        DOM.endingOverlay.classList.add('visible');
                        startTypewriter(["You left...", "from the very start.", "It just took me 100 times...", "to believe it."]);
                    }, 1500);
                }, 1000);
            }
        }

        /* --- UTILS --- */
        let typeInterval;
        function startTypewriter(lines) {
            let lineIdx = 0;
            let charIdx = 0;
            const el = DOM.endText;
            el.innerText = "";
            
            function type() {
                if(lineIdx >= lines.length) return;
                
                const currentLine = lines[lineIdx];
                el.innerText = currentLine.substring(0, charIdx);
                charIdx++;
                
                if(charIdx > currentLine.length) {
                    // Line finished, wait then next
                    setTimeout(() => {
                        lineIdx++;
                        charIdx = 0;
                        if(lineIdx < lines.length) type();
                    }, 1000);
                } else {
                    typeInterval = setTimeout(type, 50);
                }
            }
            
            type();
            
            // Skip on click
            el.onclick = () => {
                clearTimeout(typeInterval);
                el.innerText = lines[lineIdx]; // Finish current line
                setTimeout(() => {
                    lineIdx++; charIdx=0; 
                    if(lineIdx < lines.length) type();
                }, 500);
            };
        }

        function createParticle() {
            const p = document.createElement('div');
            p.innerText = ['❤','✨'][Math.floor(Math.random()*2)];
            p.className = 'heart-particle';
            p.style.left = Math.random()*100 + 'vw';
            p.style.fontSize = (Math.random()*20+10)+'px';
            p.style.color = '#ff758c';
            document.getElementById('particles-container').appendChild(p);
            setTimeout(()=>p.remove(), 4000);
        }

        function resetGame() {
            STATE.yesCount = 0;
            STATE.noCount = 0;
            STATE.scoreClicked = false;
            STATE.isEnding = false;
            STATE.currentEnding = 0;
            STATE.roomProgress = { tulip: false, letter: false, diary: false };
            
            resetGameUI();
            updateUI();
            AudioMgr.playGame();
        }

        function resetGameUI() {
            DOM.gameView.style.opacity = '1';
            DOM.gameView.style.pointerEvents = 'auto';
            DOM.endingOverlay.classList.remove('visible');
            DOM.roomScene.classList.remove('visible');
            DOM.secretModal.classList.remove('visible');
            DOM.lblYes.style.color = "#666";
            DOM.lblYes.style.textShadow = "none";
        }
        
        function showTooltip(msg) {
            const t = document.createElement('div');
            t.style.position='fixed'; t.style.top='50%'; t.style.left='50%'; t.style.transform='translate(-50%,-50%)';
            t.style.background='rgba(0,0,0,0.8)'; t.style.color='white'; t.style.padding='10px 20px'; t.style.borderRadius='20px';
            t.style.zIndex='9999'; t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(()=>t.remove(), 1500);
        }

        function getRandomDialogue() {
            const d = ["Please...", "Just one click.", "Don't be shy.", "I have cookies! 🍪", "Is that a misclick?", "Try again?"];
            return d[Math.floor(Math.random()*d.length)];
        }
        
        // Confetti Helper
        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const p = [];
            for(let i=0; i<100; i++) p.push({x: Math.random()*canvas.width, y: -20, c: ['gold', 'pink', 'white'][Math.floor(Math.random()*3)], s: Math.random()*5+2, d: Math.random()*5+2});
            function draw() {
                if(!STATE.isEnding) return; 
                ctx.clearRect(0,0,canvas.width,canvas.height);
                p.forEach(o => { ctx.fillStyle=o.c; ctx.fillRect(o.x,o.y,o.s,o.s); o.y+=o.s; if(o.y>canvas.height) o.y=-10; });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // Boot
        init();

    </script>
</body>
</html>
