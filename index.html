<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You Be My Valentine? 💘</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --primary-pink: #ff758c;
            --secondary-pink: #ff7eb3;
            --dark-text: #4a4a4a;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --btn-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(120deg, #a18cd1 0%, #fbc2eb 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Particles */
        #particles-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .heart-particle {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* UI Reset Button */
        .ui-btn {
            position: absolute;
            top: 20px; right: 20px;
            z-index: 100;
            background: rgba(255,255,255,0.5);
            border: 1px solid white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            color: #555;
            backdrop-filter: blur(5px);
        }

        /* Game Container */
        .game-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            perspective: 1000px;
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            text-align: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .progress-wrapper {
            flex-grow: 1;
            height: 8px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            margin: 0 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Content */
        #stage-indicator {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 5px;
        }

        .title {
            font-family: 'Fredoka', cursive;
            color: var(--primary-pink);
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
            line-height: 1.2;
        }

        .dialogue-box {
            min-height: 40px;
            margin-bottom: 20px;
            color: #555;
            font-style: italic;
            font-size: 1.1rem;
        }

        /* Button Area */
        .button-area {
            position: relative;
            height: 300px; /* Interaction space */
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align top initially */
            gap: 20px;
            padding-top: 10px;
        }

        .game-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, background 0.3s;
            outline: none;
            position: relative; /* Default relative */
            white-space: nowrap;
            z-index: 10;
        }

        .btn-yes {
            background: linear-gradient(45deg, var(--primary-pink), var(--secondary-pink));
            color: white;
            box-shadow: var(--btn-shadow);
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            background: #e0e0e0;
            color: #666;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-no:active {
            transform: scale(0.95);
            background: #d6d6d6;
        }

        /* --- CLONE & BLUR STAGE SPECIALS --- */

        /* Fake Buttons Container */
        #fake-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Allows clicks to pass through to real buttons underneath */
            z-index: 8;
            overflow: hidden; /* Prevent clones from sticking out */
            border-radius: 20px;
        }

        .fake-btn {
            position: absolute;
            opacity: 0.8; /* Base opacity, slightly distinguishable */
            filter: brightness(0.95);
            pointer-events: auto; /* CRITICAL: Enables clicking on the clone buttons */
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s, opacity 0.2s;
        }

        /* Blur Modes */
        .blur-heavy { filter: blur(4px); }
        .spin-fast { animation: spin 0.8s linear infinite; }

        /* Hard Blur Stage: Equalize buttons */
        .blur-mode {
            filter: blur(3.5px) !important;
            background: #a29bfe !important; /* Uniform distinct color */
            color: white !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1) !important;
            transform: scale(0.95);
            transition: transform 0.1s !important;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Win Screen */
        #win-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden { display: none !important; }

        .win-content {
            background: rgba(255,255,255,0.9);
            max-width: 400px;
            z-index: 1002;
            padding: 40px 20px;
        }

        .win-content h1 { color: var(--primary-pink); font-size: 3rem; }
        .win-content h2 { color: #555; font-size: 1.2rem; margin-bottom: 20px; }
        .win-stats { font-size: 1.2rem; margin: 20px 0; color: #444; }
        .win-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

        .action-btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            background: var(--secondary-pink);
            color: white;
        }

        #confetti-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1001;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Floating Background Particles -->
    <div id="particles-container"></div>

    <!-- UI Controls -->
    <button id="reset-btn" class="ui-btn" title="Reset Progress">↻ Reset</button>

    <!-- Main Game Container -->
    <div class="game-container">
        <div class="glass-card" id="main-card">
            
            <!-- Header Stats -->
            <div class="stats-bar">
                <div class="timer">⏱ <span id="time-display">00:00.00</span></div>
                <div class="progress-wrapper">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="counter">YES: <span id="yes-count">0</span>/101</div>
            </div>

            <!-- Stage Indicator -->
            <div id="stage-indicator" class="stage-text">Stage: 1 / 101</div>

            <!-- Main Title & Dialogue -->
            <h1 class="title">Will you be my valentine? 💘</h1>
            <div class="dialogue-box">
                <p id="dialogue-text">Please say yes! 🥺</p>
            </div>

            <!-- Interaction Area -->
            <div class="button-area" id="button-area">
                <!-- YES Button -->
                <button id="btn-yes" class="game-btn btn-yes">YES 💖</button>
                <!-- NO Button -->
                <button id="btn-no" class="game-btn btn-no">NO 💔</button>
                
                <!-- Container for Clones -->
                <div id="fake-container"></div>
            </div>
            
        </div>
    </div>

    <!-- Win Screen Overlay -->
    <div id="win-screen" class="hidden" style="display: none;">
        <div class="win-content glass-card">
            <h1>YAYYY!!! 💍</h1>
            <h2>YOU SAID YES 101 TIMES! 💘</h2>
            <div class="win-stats">
                <p>Time: <span id="final-time">00:00</span></p>
                <p>NO Clicks: <span id="final-no">0</span></p>
            </div>
            <p class="win-note">You are officially my valentine now! 🥰</p>
            <div class="win-actions">
                <button id="btn-share" class="action-btn">Share Result 💌</button>
                <button id="btn-replay" class="action-btn">Play Again 🔄</button>
            </div>
        </div>
        <canvas id="confetti-canvas"></canvas>
    </div>

    <script>
        /* --- GAME STATE & CONFIG --- */
        const CONFIG = {
            TOTAL_STAGES: 101,
            STORAGE_KEY: 'valentine_game_state_v1'
        };

        const STATE = {
            yesCount: 0,
            noCount: 0,
            startTime: null,
            isWin: false,
            effects: [] // Will be populated
        };

        /* --- DOM CACHE --- */
        const DOM = {
            yesBtn: document.getElementById('btn-yes'),
            noBtn: document.getElementById('btn-no'),
            mainCard: document.getElementById('main-card'),
            buttonArea: document.getElementById('button-area'),
            dialogue: document.getElementById('dialogue-text'),
            yesCount: document.getElementById('yes-count'),
            timeDisplay: document.getElementById('time-display'),
            progressFill: document.getElementById('progress-fill'),
            stageIndicator: document.getElementById('stage-indicator'),
            resetBtn: document.getElementById('reset-btn'),
            winScreen: document.getElementById('win-screen'),
            finalTime: document.getElementById('final-time'),
            finalNo: document.getElementById('final-no'),
            fakeContainer: document.getElementById('fake-container'),
            confettiCanvas: document.getElementById('confetti-canvas')
        };

        /* --- AUDIO ENGINE (WebAudio API) --- */
        const AudioEngine = {
            ctx: new (window.AudioContext || window.webkitAudioContext)(),
            
            playTone(freq, type, duration, vol = 0.1) {
                // Safety check for suspended state
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // Audio context might be restricted, ignore error
                }
            },

            playYes() { this.playTone(800 + Math.random()*200, 'sine', 0.15, 0.2); },
            playNo() { this.playTone(150, 'sawtooth', 0.3, 0.15); },
            playWin() { 
                [440, 554, 659, 880].forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.5, 0.2), i*100)); 
            }
        };

        /* --- DIALOGUES --- */
        const DIALOGUES = [
            "Please say yes! 🥺", "Don't be mean... 💔", "I'll make you cookies! 🍪",
            "Is that a misclick? 🤨", "Are you sure? 🧐", "Stop breaking my heart 😭",
            "I'm not giving up! 💪", "Just one little click... 🤏", "Love is patient... 🕊️",
            "You're testing me... 😤", "Okay, now it's war 😈", "Click YES to win 🏆",
            "Why are you running? 🏃‍♂️", "Pretty please? 🍒", "I know you want to 😏"
        ];

        function getRandomDialogue() {
            return DIALOGUES[Math.floor(Math.random() * DIALOGUES.length)];
        }

        /* --- UTILITIES --- */
        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = (totalSec % 60).toString().padStart(2, '0');
            const centi = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
            return `${m}:${s}.${centi}`;
        }

        // Reset visual properties of buttons for a clean slate
        function resetButtons() {
            const btns = [DOM.yesBtn, DOM.noBtn];
            btns.forEach(b => {
                if (!b) return;
                b.style.transform = 'none';
                b.style.position = 'relative'; // Reset to relative layout flow
                b.style.left = 'auto';
                b.style.top = 'auto';
                b.style.opacity = '1';
                b.style.filter = 'none';
                b.style.transition = '0.2s';
                b.style.pointerEvents = 'auto';
                b.classList.remove('blur-heavy', 'spin-fast', 'blur-mode');
                
                // Remove all event listeners via cloning (nuclear option)
                const newB = b.cloneNode(true);
                if (b.parentNode) b.parentNode.replaceChild(newB, b);
            });
            
            // Re-acquire DOM references after clone
            DOM.yesBtn = document.getElementById('btn-yes');
            DOM.noBtn = document.getElementById('btn-no');

            // Re-attach standard listeners if elements exist
            if (DOM.yesBtn) DOM.yesBtn.addEventListener('pointerdown', handleYes);
            if (DOM.noBtn) DOM.noBtn.addEventListener('pointerdown', handleNo);

            // Clear fake container
            if (DOM.fakeContainer) DOM.fakeContainer.innerHTML = '';
            
            // Reset layout
            if (DOM.buttonArea) DOM.buttonArea.style.flexDirection = 'row';
        }

        /* --- SPAWN UTILS (SMART SPAWN) --- */
        function getNonOverlappingPosition(width, height, existingPositions) {
            if (!DOM.buttonArea) return { x: 0, y: 0 };
            
            const area = DOM.buttonArea.getBoundingClientRect();
            const padding = 10;
            
            // Define Safe Zone: Avoid top 25% (Dialogue area)
            const safeTop = area.height * 0.25; 
            const maxY = area.height - height - padding;
            const maxX = area.width - width - padding;
            
            const maxAttempts = 50; 
            const minDistance = 75; 

            for (let i = 0; i < maxAttempts; i++) {
                const x = Math.random() * (maxX - padding) + padding;
                const y = Math.random() * (maxY - safeTop) + safeTop;

                let overlap = false;
                for (const pos of existingPositions) {
                    const dx = (x + width/2) - (pos.x + width/2);
                    const dy = (y + height/2) - (pos.y + height/2);
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    if (distance < minDistance) { overlap = true; break; }
                }

                if (!overlap) return { x, y };
            }
            // Fallback
            return {
                x: Math.random() * (maxX - padding) + padding,
                y: Math.random() * (maxY - safeTop) + safeTop
            };
        }

        /* --- EFFECT GENERATORS --- */
        const EffectGen = {
            // 1. Static/Simple
            static: () => ({ name: "Normal", init: () => {} }),
            
            // 2. Wiggle/Small Movement
            wiggle: (intensity) => ({
                name: "Wiggle",
                init: () => {
                    DOM.yesBtn.style.position = 'relative';
                    const tick = () => {
                        const x = (Math.random() - 0.5) * intensity;
                        const y = (Math.random() - 0.5) * intensity;
                        DOM.yesBtn.style.transform = `translate(${x}px, ${y}px)`;
                        requestAnimationFrame(tick);
                    };
                }
            }),

            // 3. Run Away (Hover/Proximity)
            runAway: (speed) => ({
                name: "RunAway",
                init: () => {
                    DOM.yesBtn.style.position = 'absolute';
                    DOM.yesBtn.style.transition = `top ${0.3/speed}s, left ${0.3/speed}s`;
                    
                    const move = () => {
                        const area = DOM.buttonArea.getBoundingClientRect();
                        const btn = DOM.yesBtn.getBoundingClientRect();
                        // Safe zone math
                        const x = Math.random() * (area.width - btn.width);
                        const y = Math.random() * (area.height - btn.height); 
                        DOM.yesBtn.style.left = x + 'px';
                        DOM.yesBtn.style.top = y + 'px';
                    };
                    
                    move();
                    DOM.yesBtn.onpointerover = move; 
                }
            }),

            // 4. Visual Tricks (Scale/Opacity/Blur)
            visual: (type, val) => ({
                name: "Visual",
                init: () => {
                    if (type === 'scale') DOM.yesBtn.style.transform = `scale(${val})`;
                    if (type === 'opacity') {
                        const clampedOpacity = Math.min(Math.max(val, 0.18), 0.28);
                        DOM.yesBtn.style.opacity = clampedOpacity;
                        DOM.dialogue.innerText = "Where is it? 👻";
                    }
                    if (type === 'blur') {
                        DOM.yesBtn.classList.add('blur-mode');
                        DOM.noBtn.classList.add('blur-mode');
                        const isSwapped = Math.random() > 0.5;
                        DOM.buttonArea.style.flexDirection = isSwapped ? 'row-reverse' : 'row';
                        DOM.dialogue.innerText = "Read carefully... 🌫️";
                    }
                }
            }),

            // 5. Clones (Smart Spawning + Penalty)
            clones: (count) => ({
                name: "Clones",
                init: () => {
                    DOM.yesBtn.style.position = 'absolute';
                    DOM.yesBtn.style.zIndex = '20';
                    DOM.dialogue.innerText = "Which one is real? 🤔";
                    
                    const btnW = DOM.yesBtn.offsetWidth || 110;
                    const btnH = DOM.yesBtn.offsetHeight || 50;
                    const usedPositions = [];

                    // Position Real Button
                    const pReal = getNonOverlappingPosition(btnW, btnH, usedPositions);
                    usedPositions.push(pReal);
                    DOM.yesBtn.style.left = pReal.x + 'px';
                    DOM.yesBtn.style.top = pReal.y + 'px';

                    // Spawn Clones
                    for(let i=0; i<count; i++){
                        const clone = document.createElement('button');
                        clone.className = 'game-btn btn-yes fake-btn';
                        clone.innerText = "YES 💖";
                        clone.style.opacity = (Math.random() * 0.05 + 0.75).toString(); 
                        
                        const p = getNonOverlappingPosition(btnW, btnH, usedPositions);
                        usedPositions.push(p);
                        clone.style.left = p.x + 'px';
                        clone.style.top = p.y + 'px';

                        // Penalty Logic
                        clone.onpointerdown = (e) => {
                            e.stopPropagation(); e.preventDefault();
                            AudioEngine.playNo();
                            STATE.noCount++;
                            
                            DOM.mainCard.classList.remove('shake');
                            void DOM.mainCard.offsetWidth;
                            DOM.mainCard.classList.add('shake');
                            
                            DOM.dialogue.innerText = getRandomDialogue();
                            updateUI();
                            saveGame();

                            clone.innerText = "NOPE 💀";
                            clone.style.background = "#57606f";
                            clone.style.transform = "scale(0.8)";
                            setTimeout(() => clone.remove(), 400);
                        };
                        DOM.fakeContainer.appendChild(clone);
                    }
                }
            })
        };

        /* --- GENERATE 101 STAGES --- */
        function generateStages() {
            const ef = [];
            for(let i=0; i<=101; i++) {
                if(i < 5) ef.push(EffectGen.static());
                else if(i < 15) ef.push(EffectGen.wiggle(i * 2));
                else if(i < 25) ef.push(EffectGen.runAway(1));
                else if(i < 35) ef.push(EffectGen.visual('scale', 0.8));
                else if(i < 45) ef.push(EffectGen.runAway(2));
                else if(i < 55) ef.push(EffectGen.visual('opacity', 0.2)); 
                else if(i < 65) ef.push(EffectGen.clones(Math.floor(i/10)));
                else if(i < 75) ef.push(EffectGen.visual('blur', 0)); 
                else if(i < 85) ef.push(EffectGen.clones(10));
                else if(i < 95) ef.push(EffectGen.runAway(3)); 
                else if(i < 101) ef.push(EffectGen.visual('scale', 0.5));
                else ef.push(EffectGen.static()); 
            }
            STATE.effects = ef;
        }

        /* --- GAME LOOP --- */
        function initGame() {
            loadGame();
            generateStages();
            updateUI();
            applyCurrentStage();
            
            setInterval(() => {
                if(STATE.startTime && !STATE.isWin) {
                    const now = Date.now();
                    DOM.timeDisplay.innerText = formatTime(now - STATE.startTime);
                }
            }, 30);
            
            createParticles();
        }

        function handleYes() {
            if(STATE.isWin) return;
            
            if(STATE.yesCount === 0) {
                STATE.startTime = Date.now();
            }

            AudioEngine.playYes();
            STATE.yesCount++;
            
            spawnFloatingHeart(DOM.yesBtn);
            DOM.dialogue.innerText = "Yay! 💘";
            
            if(STATE.yesCount >= CONFIG.TOTAL_STAGES) {
                winGame();
            } else {
                saveGame();
                applyCurrentStage();
                updateUI();
            }
        }

        function handleNo() {
            AudioEngine.playNo();
            STATE.noCount++;
            DOM.mainCard.classList.remove('shake');
            void DOM.mainCard.offsetWidth; 
            DOM.mainCard.classList.add('shake');
            DOM.dialogue.innerText = getRandomDialogue();
            updateUI();
            saveGame();
        }

        function applyCurrentStage() {
            if(STATE.yesCount >= 101) return;
            resetButtons();
            const effectFn = STATE.effects[STATE.yesCount];
            if(effectFn && effectFn.init) effectFn.init();
        }

        function updateUI() {
            DOM.yesCount.innerText = STATE.yesCount;
            DOM.progressFill.style.width = `${(STATE.yesCount / CONFIG.TOTAL_STAGES) * 100}%`;
            DOM.stageIndicator.innerText = `Stage: ${STATE.yesCount + 1} / ${CONFIG.TOTAL_STAGES}`;
        }

        function winGame() {
            STATE.isWin = true;
            DOM.winScreen.style.display = 'flex'; // Enable flex for centering
            DOM.winScreen.classList.remove('hidden');
            
            const duration = Date.now() - STATE.startTime;
            DOM.finalTime.innerText = formatTime(duration);
            DOM.finalNo.innerText = STATE.noCount;
            
            AudioEngine.playWin();
            startConfetti();
            saveGame();
        }

        /* --- SAVE/LOAD --- */
        function saveGame() {
            const data = {
                yesCount: STATE.yesCount,
                noCount: STATE.noCount,
                startTime: STATE.startTime,
                isWin: STATE.isWin
            };
            localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data));
        }

        function loadGame() {
            const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
            if(saved) {
                const parsed = JSON.parse(saved);
                STATE.yesCount = parsed.yesCount || 0;
                STATE.noCount = parsed.noCount || 0;
                STATE.startTime = parsed.startTime;
                STATE.isWin = parsed.isWin || false;
            }
        }

        if (DOM.resetBtn) {
            DOM.resetBtn.addEventListener('click', () => {
                if(confirm('Start over?')) {
                    localStorage.removeItem(CONFIG.STORAGE_KEY);
                    location.reload();
                }
            });
        }

        if (DOM.yesBtn) DOM.yesBtn.addEventListener('pointerdown', handleYes);
        if (DOM.noBtn) DOM.noBtn.addEventListener('pointerdown', handleNo);

        /* --- EXTRA VISUALS (PARTICLES/CONFETTI) --- */
        function createParticles() {
            const container = document.getElementById('particles-container');
            if (!container) return;

            const colors = ['#ff758c', '#ff7eb3', '#a29bfe', '#fab1a0'];
            
            for(let i=0; i<30; i++) {
                const p = document.createElement('div');
                p.className = 'heart-particle';
                p.innerText = ['❤', '✨', '🌸'][Math.floor(Math.random()*3)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.fontSize = (Math.random() * 20 + 10) + 'px';
                p.style.color = colors[Math.floor(Math.random()*colors.length)];
                p.style.animationDuration = (Math.random() * 5 + 5) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        function spawnFloatingHeart(target) {
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const heart = document.createElement('div');
            heart.innerText = "💖";
            heart.style.position = 'fixed';
            heart.style.left = (rect.left + rect.width/2) + 'px';
            heart.style.top = rect.top + 'px';
            heart.style.fontSize = '2rem';
            heart.style.pointerEvents = 'none';
            heart.style.zIndex = '100';
            heart.style.transition = '1s';
            
            document.body.appendChild(heart);
            
            requestAnimationFrame(() => {
                heart.style.transform = `translate(0, -100px) scale(1.5)`;
                heart.style.opacity = '0';
            });
            
            setTimeout(() => heart.remove(), 1000);
        }

        function startConfetti() {
            const canvas = DOM.confettiCanvas;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const pieces = [];
            const colors = ['#ff758c', '#a29bfe', '#fdcb6e', '#00b894'];
            
            for(let i=0; i<150; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 5 + 2,
                    drift: Math.random() * 2 - 1
                });
            }
            
            function loop() {
                ctx.clearRect(0,0,canvas.width, canvas.height);
                pieces.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    p.y += p.speed;
                    p.x += p.drift;
                    if(p.y > canvas.height) p.y = -20;
                });
                requestAnimationFrame(loop);
            }
            loop();
        }

        /* --- BOOTSTRAP --- */
        const shareBtn = document.getElementById('btn-share');
        if (shareBtn) {
            shareBtn.onclick = () => {
                const text = `I survived the Valentine YES Challenge 💘\nAttempts: ${STATE.noCount} NOs\nTime: ${DOM.finalTime.innerText}`;
                navigator.clipboard.writeText(text).then(() => alert('Result copied! Send it to your valentine 💌'));
            };
        }

        const replayBtn = document.getElementById('btn-replay');
        if (replayBtn) {
            replayBtn.onclick = () => {
                localStorage.removeItem(CONFIG.STORAGE_KEY);
                location.reload();
            };
        }

        // Start
        initGame();
    </script>
</body>
</html>
