<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You Be My Valentine? 💘</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&family=Noto+Sans:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --primary-pink: #ff758c;
            --secondary-pink: #ff7eb3;
            --dark-text: #4a4a4a;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --btn-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);

            /* Ending Themes */
            --theme-1-bg: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --theme-2-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --theme-3-bg: #1a1a1a;
            --theme-4-bg: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: manipulation; }

        body {
            font-family: 'Nunito', 'Noto Sans', sans-serif;
            background: linear-gradient(120deg, #a18cd1 0%, #fbc2eb 100%);
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* Particles */
        #particles-container { position: absolute; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .heart-particle { position: absolute; color: rgba(255, 255, 255, 0.6); animation: floatUp linear infinite; }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Top Controls */
        .top-controls { position: absolute; top: 20px; right: 20px; z-index: 500; display: flex; gap: 10px; }
        .ui-btn {
            background: rgba(255,255,255,0.5); border: 1px solid white;
            padding: 8px 15px; border-radius: 20px; cursor: pointer;
            font-family: 'Fredoka', sans-serif; color: #555; backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .ui-btn:hover { background: rgba(255,255,255,0.8); }
        .icon-btn { font-size: 1.2rem; padding: 6px 12px; }

        /* Game Container */
        .game-container { position: relative; z-index: 10; width: 90%; max-width: 500px; perspective: 1000px; transition: opacity 0.5s; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border); border-radius: 24px;
            padding: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            text-align: center; transition: transform 0.2s;
        }
        .glass-card.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Stats Bar (NEW LAYOUT) */
        .stats-container { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
        .stat-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #666; font-weight: 700; }
        .stat-label { width: 55px; text-align: right; cursor: default; }
        .stat-label.clickable { cursor: pointer; transition: 0.2s; }
        .progress-track { flex-grow: 1; height: 8px; background: rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.3s ease; }
        .stat-val { width: 45px; text-align: left; font-family: 'Fredoka', monospace; font-size: 0.85rem; }

        #bar-yes { background: linear-gradient(90deg, #ff9a9e, #ff758c); }
        #bar-no { background: linear-gradient(90deg, #a18cd1, #bc4e9c); }
        #bar-choice { background: linear-gradient(90deg, #fbc2eb, #a6c1ee); }

        /* Content */
        #stage-indicator { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 5px; }
        .title { font-family: 'Fredoka', cursive; color: var(--primary-pink); font-size: 2rem; margin-bottom: 15px; text-shadow: 2px 2px 0px rgba(255,255,255,0.8); line-height: 1.2; }
        .dialogue-box { min-height: 40px; margin-bottom: 20px; color: #555; font-style: italic; font-size: 1.1rem; }

        /* Buttons */
        .button-area { position: relative; height: 300px; width: 100%; display: flex; justify-content: center; align-items: flex-start; gap: 20px; padding-top: 10px; }
        .game-btn {
            font-family: 'Fredoka', sans-serif; font-size: 1.2rem; padding: 12px 30px;
            border: none; border-radius: 50px; cursor: pointer; transition: 0.2s;
            outline: none; position: relative; z-index: 10; white-space: nowrap;
        }
        .btn-yes { background: linear-gradient(45deg, var(--primary-pink), var(--secondary-pink)); color: white; box-shadow: var(--btn-shadow); }
        .btn-yes:active { transform: scale(0.95); }
        .btn-no { background: #e0e0e0; color: #666; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-no:active { transform: scale(0.95); background: #d6d6d6; }

        /* Fake/Effects */
        #fake-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; overflow: hidden; border-radius: 20px; }
        .fake-btn { position: absolute; opacity: 0.8; pointer-events: auto; }
        .blur-heavy { filter: blur(4px); }
        .spin-fast { animation: spin 0.8s linear infinite; }
        .blur-mode { filter: blur(3.5px) !important; background: #a29bfe !important; color: white !important; transform: scale(0.95); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- OVERLAYS --- */
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            opacity: 1; transition: opacity 0.5s ease;
        }
        .hidden { opacity: 0; pointer-events: none; display: none !important; }
        .visible { opacity: 1; pointer-events: auto; display: flex !important; }

        /* Start Overlay */
        #start-overlay { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); z-index: 2000; flex-direction: column; }
        .start-btn { font-size: 2rem; padding: 20px 50px; border-radius: 50px; border: 4px solid white; background: rgba(255,255,255,0.3); color: white; cursor: pointer; font-family: 'Fredoka', cursive; animation: pulse 1.5s infinite; text-transform: uppercase; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Lobby */
        .lobby-card { max-width: 450px; padding: 40px; z-index: 1002; background: rgba(255,255,255,0.95); }
        .subtitle { font-size: 1.1rem; color: #666; margin-bottom: 30px; }
        .lobby-actions { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .lobby-msg { height: 24px; font-size: 0.95rem; color: #ff5252; font-weight: bold; margin-top: 10px; }
        .music-credit { margin-top: 20px; font-size: 0.85rem; color: #888; font-style: italic; opacity: 0.8; }

        /* Settings */
        .settings-card { width: 350px; z-index: 1005; background: rgba(255,255,255,0.95); }
        .settings-card h2 { text-align: center; color: #555; margin-bottom: 25px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.1rem; color: #444; }
        .setting-item.column { flex-direction: column; align-items: flex-start; gap: 10px; }
        .lang-dropdown { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; font-size: 1rem; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-pink); }
        input:checked + .slider:before { transform: translateX(24px); }
        .action-btn { padding: 12px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: var(--secondary-pink); color: white; width: 100%; }

        /* --- ENDING SYSTEM STYLES --- */
        #ending-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2500; display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 1s ease;
            color: white; padding: 20px; text-align: center;
        }
        #ending-overlay.visible { opacity: 1; pointer-events: auto; }
        
        .theme-1 { background: var(--theme-1-bg); }
        .theme-2 { background: var(--theme-2-bg); }
        .theme-3 { background: var(--theme-3-bg); }
        .theme-4 { background: var(--theme-4-bg); }

        .ending-content { max-width: 500px; width: 100%; z-index: 2; }
        .ending-title { font-family: 'Fredoka', cursive; font-size: 3rem; margin-bottom: 5px; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .ending-sub { font-size: 1rem; opacity: 0.9; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; }
        
        .cinematic-text {
            font-family: 'Nunito', sans-serif; font-size: 1.3rem; min-height: 140px;
            background: rgba(0,0,0,0.2); padding: 25px; border-radius: 15px;
            margin-bottom: 30px; display: flex; align-items: center; justify-content: center;
            line-height: 1.5; cursor: pointer; backdrop-filter: blur(5px);
        }

        .ending-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .end-btn {
            background: rgba(255,255,255,0.25); border: 2px solid white; color: white;
            padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: bold;
            transition: 0.2s; font-size: 1rem;
        }
        .end-btn:hover { background: white; color: #333; }

        /* Room Scene */
        #room-scene {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d0d0d; z-index: 1500; display: none; opacity: 0; transition: opacity 1.5s;
            overflow: hidden; font-family: 'VT323', monospace;
        }
        #room-scene.visible { display: block; opacity: 1; pointer-events: auto; }
        .room-bg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; height: 100%; max-width: 800px;
            background: radial-gradient(circle at 70% 30%, #2a2a2a 0%, #000000 90%);
        }
        .room-obj { position: absolute; cursor: pointer; transition: 0.3s; font-size: 3rem; filter: grayscale(0.7) brightness(0.8); }
        .room-obj:hover { filter: grayscale(0) brightness(1.2) drop-shadow(0 0 10px rgba(255,255,255,0.3)); transform: scale(1.1); }
        
        #obj-tulip { bottom: 20%; left: 20%; font-size: 3.5rem; }
        #obj-letter { bottom: 35%; left: 45%; font-size: 2.5rem; transform: rotate(-10deg); }
        #obj-diary { bottom: 25%; right: 25%; font-size: 3rem; }
        #obj-window { top: 10%; right: 10%; font-size: 5rem; opacity: 0.5; pointer-events: auto; }
        #obj-lamp { bottom: 40%; right: 10%; font-size: 3rem; color: #fdcb6e; filter: brightness(0.9); }

        #room-tooltip {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #ccc; padding: 10px 20px;
            border-radius: 5px; font-size: 1.4rem; pointer-events: none; opacity: 0; transition: 0.3s; width: max-content;
        }
        #room-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 400px; background: #1a1a1a; border: 1px solid #444;
            padding: 25px; color: #eee; text-align: center; display: none;
            box-shadow: 0 0 50px rgba(0,0,0,1); z-index: 1600;
        }
        #room-modal-text { font-size: 1.3rem; min-height: 80px; margin-bottom: 20px; line-height: 1.4; text-align: left; }
        .room-close-btn { background: #333; color: white; border: 1px solid #666; padding: 8px 20px; cursor: pointer; font-family: inherit; font-size: 1.2rem; }

        /* Secret Modal */
        #secret-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.5s;
        }
        #secret-modal.visible { opacity: 1; pointer-events: auto; }
        .secret-btn {
            font-size: 2.5rem; padding: 15px 50px; margin-top: 40px;
            background: gold; color: black; border: none; border-radius: 50px; font-family: 'Fredoka', sans-serif;
            cursor: pointer; box-shadow: 0 0 30px gold; animation: pulse 0.8s infinite;
        }

        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2400; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Audio Elements -->
    <audio id="bgm-lobby" loop preload="auto" type="audio/mpeg"></audio>
    <audio id="bgm-game" loop preload="auto" type="audio/mpeg"></audio>
    <audio id="bgm-end" loop preload="auto" type="audio/mpeg"></audio>

    <!-- Background -->
    <div id="particles-container"></div>

    <!-- UI Controls -->
    <div class="top-controls">
        <button id="settings-btn" class="ui-btn icon-btn" title="Settings">⚙️</button>
        <button id="reset-btn" class="ui-btn" title="Reset">↻</button>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <div class="game-container" id="game-view">
        <div class="glass-card" id="main-card">
            
            <!-- NEW STATS LAYOUT -->
            <div class="stats-container">
                <!-- YES BAR -->
                <div class="stat-row">
                    <div class="stat-label clickable" id="lbl-yes-trigger" title="Score?">YES</div>
                    <div class="progress-track"><div class="progress-bar" id="bar-yes"></div></div>
                    <div class="stat-val" id="val-yes">00/101</div>
                </div>
                <!-- NO BAR -->
                <div class="stat-row">
                    <div class="stat-label">NO</div>
                    <div class="progress-track"><div class="progress-bar" id="bar-no"></div></div>
                    <div class="stat-val" id="val-no">00/100</div>
                </div>
                <!-- CHOICE BAR -->
                <div class="stat-row">
                    <div class="stat-label">ALL</div>
                    <div class="progress-track"><div class="progress-bar" id="bar-choice"></div></div>
                    <div class="stat-val" id="val-choice">00/101</div>
                </div>
            </div>

            <!-- Stage Info -->
            <div id="stage-indicator" class="stage-text">Stage: 1 / 101</div>

            <!-- Main Title & Dialogue -->
            <h1 class="title" id="main-title">Will you be my valentine? 💘</h1>
            <div class="dialogue-box">
                <p id="dialogue-text">Please say yes! 🥺</p>
            </div>

            <!-- Buttons -->
            <div class="button-area" id="button-area">
                <button id="btn-yes" class="game-btn btn-yes">YES 💖</button>
                <button id="btn-no" class="game-btn btn-no">NO 💔</button>
                <div id="fake-container"></div>
            </div>
            
        </div>
    </div>

    <!-- OVERLAYS -->

    <!-- 1. START -->
    <div id="start-overlay" class="overlay-screen">
        <button id="btn-start-game" class="start-btn">Tap to Start 💘</button>
    </div>

    <!-- 2. LOBBY -->
    <div id="lobby-screen" class="overlay-screen hidden">
        <div class="glass-card lobby-card">
            <h1 class="title" id="lobby-title">Will you be my valentine? 💘</h1>
            <p class="subtitle" id="lobby-subtitle">You must say YES 101 times to win 😈</p>
            <div class="lobby-actions">
                <button id="lobby-btn-yes" class="game-btn btn-yes">YES 💖</button>
                <button id="lobby-btn-no" class="game-btn btn-no">NO 💔</button>
            </div>
            <p id="lobby-msg" class="lobby-msg"></p>
            <p id="music-credit-text" class="music-credit">🎵 Music loaded</p>
        </div>
    </div>

    <!-- 3. SETTINGS -->
    <div id="settings-modal" class="overlay-screen hidden">
        <div class="glass-card settings-card">
            <h2 id="st-title">Settings ⚙️</h2>
            <div class="setting-item">
                <span id="st-lobby-music">Lobby Music</span>
                <label class="switch"><input type="checkbox" id="toggle-lobby-music" checked><span class="slider round"></span></label>
            </div>
            <div class="setting-item">
                <span id="st-game-music">Game Music</span>
                <label class="switch"><input type="checkbox" id="toggle-game-music" checked><span class="slider round"></span></label>
            </div>
            <div class="setting-item column">
                <span id="st-language">Language</span>
                <select id="lang-select" class="lang-dropdown">
                    <option value="en">English 🇺🇸</option>
                    <option value="vi">Tiếng Việt 🇻🇳</option>
                    <option value="es">Español 🇪🇸</option>
                </select>
            </div>
            <button id="close-settings" class="action-btn">Close</button>
        </div>
    </div>

    <!-- 4. ENDING OVERLAY (Generic for 1, 2, 4) -->
    <div id="ending-overlay">
        <div class="ending-content">
            <h1 class="ending-title" id="end-title">TRUE LOVE</h1>
            <p class="ending-sub" id="end-sub">YES: 101/101</p>
            <div class="cinematic-text" id="end-text"></div>
            <div class="ending-actions">
                <button class="end-btn" id="btn-end-replay">↻ Replay</button>
                <button class="end-btn" id="btn-end-lobby">🏠 Lobby</button>
                <button class="end-btn" id="btn-end-share">💌 Share</button>
            </div>
        </div>
        <canvas id="confetti-canvas"></canvas>
    </div>

    <!-- 5. ENDING 3: ROOM SCENE -->
    <div id="room-scene">
        <div class="room-bg">
            <div class="room-obj" id="obj-window" title="Window">🪟</div>
            <div class="room-obj" id="obj-lamp" title="Lamp">🏮</div>
            <!-- Main Objects -->
            <div class="room-obj" id="obj-tulip" title="Tulip">🌷</div>
            <div class="room-obj" id="obj-letter" title="Letter">✉️</div>
            <div class="room-obj" id="obj-diary" title="Diary">📓</div>
        </div>
        <div id="room-tooltip"></div>
        <div id="room-modal">
            <div id="room-modal-text"></div>
            <button class="room-close-btn" id="btn-room-close">Close</button>
        </div>
    </div>

    <!-- 6. ENDING 4: SECRET QUESTION -->
    <div id="secret-modal">
        <h1 style="color:white; font-family:'Fredoka'; text-align:center; margin:20px;">One last question...</h1>
        <div id="secret-text" style="color:white; font-size: 1.5rem; text-align:center; min-height:50px;"></div>
        <button id="btn-secret-yes" class="secret-btn">YES</button>
    </div>

        /* --- DOM CACHE --- */

        /* --- AUDIO MANAGER --- */
        const AudioCtrl = {
            async init() {
                DOM.audioLobby.volume = 0.5;
                DOM.audioGame.volume = 0.4;
                DOM.audioEnd.volume = 0.5;
                
                // Add version to bust cache
                const v = "?v=2";
                DOM.audioLobby.src = "music/lobby.mp3" + v;
                DOM.audioGame.src = "music/game.mp3" + v;
                
                // Try to validate paths (Simplified)
                try {
                    await fetch(DOM.audioLobby.src, {method:'HEAD'});
                    STATE.usingSynth = false;
                } catch(e) {
                    STATE.usingSynth = true; // Fallback to synth if needed (kept from old code logic)
                }
            },
            
            playLobby() {
                if(!SETTINGS.lobbyMusic) return;
                DOM.audioGame.pause(); DOM.audioEnd.pause();
                if(!STATE.usingSynth) DOM.audioLobby.play().catch(()=>{});
                else SynthMusic.start();
            },

            playGame() {
                if(!SETTINGS.gameMusic) return;
                DOM.audioLobby.pause(); DOM.audioEnd.pause();
                SynthMusic.stop(); // Synth only for lobby in this version
                DOM.audioGame.play().catch(()=>{});
            },

            playEnding(type) {
                if(!SETTINGS.gameMusic) return; // Use game music setting for ending
                DOM.audioLobby.pause(); DOM.audioGame.pause();
                
                let src = "";
                // Mapping music
                if(type === 1) src = "music/victory_love.mp3?v=2";
                if(type === 2) src = "music/ending_bittersweet.mp3?v=2";
                if(type === 3) src = ""; // Room = Silence
                if(type === 4) src = "music/music_box.mp3?v=2";
                
                if(src) {
                    DOM.audioEnd.src = src;
                    DOM.audioEnd.play().catch(()=>{});
                }
            },
            
            stopAll() {
                DOM.audioLobby.pause(); DOM.audioGame.pause(); DOM.audioEnd.pause();
                SynthMusic.stop();
            },
            
            update() {
                if(STATE.inLobby) {
                    if(SETTINGS.lobbyMusic) this.playLobby(); else this.stopAll();
                } else if (!STATE.isEnding) {
                    if(SETTINGS.gameMusic) this.playGame(); else this.stopAll();
                }
            }
        };

        const SFX = {
            ctx: new (window.AudioContext || window.webkitAudioContext)(),
            playTone(f,t,d) {
                if(this.ctx.state==='suspended') this.ctx.resume();
                const o=this.ctx.createOscillator(), g=this.ctx.createGain();
                o.type=t; o.frequency.value=f; g.gain.value=0.1;
                o.connect(g); g.connect(this.ctx.destination);
                o.start(); o.stop(this.ctx.currentTime+d);
            },
            playYes() { this.playTone(880, 'sine', 0.1); },
            playNo() { this.playTone(150, 'sawtooth', 0.2); }
        };

        const SynthMusic = {
            active: false,
            start() { if(this.active) return; this.active=true; this.loop(); },
            stop() { this.active=false; },
            loop() { if(!this.active) return; SFX.playTone(500,'sine',0.1); setTimeout(()=>this.loop(), 500); }
        };

        /* --- LOGIC MERGE --- */
        function initGame() {
            loadSettings();
            loadGame();
            generateStages();
            AudioCtrl.init();
            
            // Sync UI
            DOM.toggleLobby.checked = SETTINGS.lobbyMusic;
            DOM.toggleGame.checked = SETTINGS.gameMusic;
            DOM.langSelect.value = SETTINGS.lang;
            updateTexts();
            updateStatsUI();

            // Bind Events
            document.getElementById('btn-start-game').onclick = () => {
                DOM.startOverlay.classList.add('hidden');
                SFX.ctx.resume();
                if(STATE.inLobby) {
                    DOM.lobbyScreen.classList.remove('hidden');
                    AudioCtrl.playLobby();
                } else {
                    AudioCtrl.playGame();
                }
            };

            // Lobby
            document.getElementById('lobby-btn-yes').onclick = () => {
                SFX.playYes();
                STATE.inLobby = false;
                DOM.lobbyScreen.classList.add('hidden');
                AudioCtrl.playGame();
            };
            document.getElementById('lobby-btn-no').onclick = () => {
                SFX.playNo();
                const L = getLang();
                document.querySelector('.lobby-msg').innerText = L.lobbyNo[Math.floor(Math.random()*L.lobbyNo.length)];
            };

            // Game
            DOM.yesBtn.onpointerdown = handleYes;
            DOM.noBtn.onpointerdown = handleNo;
            
            // Score Easter Egg
            DOM.lblYesTrigger.onclick = () => {
                if(!STATE.scoreClicked) {
                    STATE.scoreClicked = true;
                    DOM.lblYesTrigger.style.color = "gold";
                    DOM.lblYesTrigger.style.textShadow = "0 0 5px gold";
                    showTooltip("✨ Secret Found!");
                }
            };

            // Endings
            document.getElementById('btn-end-replay').onclick = resetGame;
            document.getElementById('btn-end-lobby').onclick = () => location.reload();
            document.getElementById('btn-end-share').onclick = () => alert("Share Card coming soon! 💌");

            // Settings
            document.getElementById('settings-btn').onclick = () => DOM.settingsModal.classList.remove('hidden');
            document.getElementById('close-settings').onclick = () => DOM.settingsModal.classList.add('hidden');
            DOM.toggleLobby.onchange = (e) => { SETTINGS.lobbyMusic = e.target.checked; saveSettings(); AudioCtrl.update(); };
            DOM.toggleGame.onchange = (e) => { SETTINGS.gameMusic = e.target.checked; saveSettings(); AudioCtrl.update(); };
            DOM.langSelect.onchange = (e) => { SETTINGS.lang = e.target.value; saveSettings(); updateTexts(); };
            document.getElementById('reset-btn').onclick = () => { if(confirm(getLang().reset + "?")) resetGame(); };

            createParticles();
        }

        function handleYes() {
            if(STATE.isEnding || STATE.inLobby) return;
            
            STATE.yesCount++;
            SFX.playYes();
            updateStatsUI();
            
            // TRIGGER CHECK
            if(checkEndingTriggers()) return;

            // Normal Gameplay
            spawnFloatingHeart(DOM.yesBtn);
            DOM.dialogue.innerText = "Yay! 💘";
            saveGame();
            applyCurrentStage();
        }

        function handleNo() {
            if(STATE.isEnding || STATE.inLobby) return;
            
            STATE.noCount++;
            SFX.playNo();
            updateStatsUI();

            if(checkEndingTriggers()) return;

            DOM.mainCard.classList.remove('shake');
            void DOM.mainCard.offsetWidth;
            DOM.mainCard.classList.add('shake');
            DOM.dialogue.innerText = getLang().dialogues[Math.floor(Math.random()*getLang().dialogues.length)];
            saveGame();
        }

        function checkEndingTriggers() {
            // Ending 4: Secret
            if(STATE.yesCount === 100 && STATE.scoreClicked) {
                triggerSecretModal();
                return true;
            }
            // Ending 1: True Love
            if(STATE.yesCount >= CONFIG.YES_GOAL) {
                enterEnding(1);
                return true;
            }
            // Ending 2: Hesitant
            if(STATE.yesCount === 51 && STATE.noCount === 50) {
                enterEnding(2);
                return true;
            }
            // Ending 3: Empty Room
            if(STATE.noCount >= CONFIG.NO_GOAL) {
                enterEnding(3);
                return true;
            }
            return false;
        }

        function enterEnding(id) {
            STATE.isEnding = true;
            DOM.gameView.style.opacity = '0';
            DOM.gameView.style.pointerEvents = 'none';
            saveGame(); // Save state

            if(id === 3) {
                AudioCtrl.stopAll();
                setTimeout(() => {
                    DOM.roomScene.classList.add('visible');
                    initRoomScene();
                }, 1000);
            } else {
                AudioCtrl.playEnding(id);
                renderEndingOverlay(id);
            }
        }

        /* --- UI UPDATES --- */
        function updateStatsUI() {
            const fmt = n => n.toString().padStart(2, '0');
            const total = STATE.yesCount + STATE.noCount;
            
            DOM.valYes.innerText = `${fmt(STATE.yesCount)}/${CONFIG.YES_GOAL}`;
            DOM.valNo.innerText = `${fmt(STATE.noCount)}/${CONFIG.NO_GOAL}`;
            DOM.valChoice.innerText = `${fmt(total)}/${CONFIG.YES_GOAL}`;

            DOM.barYes.style.width = Math.min((STATE.yesCount/CONFIG.YES_GOAL)*100, 100) + "%";
            DOM.barNo.style.width = Math.min((STATE.noCount/CONFIG.NO_GOAL)*100, 100) + "%";
            DOM.barChoice.style.width = Math.min((total/CONFIG.YES_GOAL)*100, 100) + "%";
            
            const L = getLang();
            DOM.stageIndicator.innerText = `${L.stage}: ${STATE.yesCount + 1}`;
        }

        function renderEndingOverlay(id) {
            const L = getLang();
            let title="", sub="", lines=[], theme="theme-1";

            if(id===1) { title=L.end1_title; sub=L.end1_sub; lines=L.end1_lines; theme="theme-1"; }
            if(id===2) { title=L.end2_title; sub=L.end2_sub; lines=L.end2_lines; theme="theme-2"; }
            if(id===4) { title=L.end4_title; sub=L.end4_sub; lines=L.end4_lines; theme="theme-4"; }
            
            // Special Case: Final Ending 3 (called from Room)
            if(id==='3_final') { title=L.end3_title; sub=L.end3_sub; lines=L.end3_lines; theme="theme-3"; }

            DOM.endingOverlay.className = ""; // Reset
            DOM.endingOverlay.classList.add(theme);
            DOM.endTitle.innerText = title;
            DOM.endSub.innerText = sub;
            DOM.endingOverlay.classList.add('visible');
            
            startTypewriter(lines);
            if(id===1 || id===4) startConfetti();
        }

        /* --- ROOM SCENE LOGIC (ENDING 3) --- */
        function initRoomScene() {
            const L = getLang();
            const modal = document.getElementById('room-modal');
            const tooltip = document.getElementById('room-tooltip');
            const txt = document.getElementById('room-modal-text');

            // Setup Objects
            const bindObj = (id, textKey, isMain, keyName) => {
                const el = document.getElementById(id);
                el.onclick = () => {
                    if(isMain) {
                        STATE.roomProgress[keyName] = true;
                        modal.style.display = 'block';
                        let content = L[textKey];
                        if(Array.isArray(content)) content = content.join("<br><br>");
                        txt.innerHTML = content;
                        checkRoomComplete();
                    } else {
                        tooltip.innerText = L[textKey];
                        tooltip.style.opacity = 1;
                        setTimeout(()=>tooltip.style.opacity=0, 2000);
                    }
                };
            };

            bindObj('obj-window', 'room_window', false);
            bindObj('obj-lamp', 'room_lamp', false);
            bindObj('obj-tulip', 'room_tulip', true, 'tulip');
            bindObj('obj-letter', 'room_letter', true, 'letter');
            bindObj('obj-diary', 'room_diary', true, 'diary');

            document.getElementById('btn-room-close').onclick = () => modal.style.display = 'none';
        }

        function checkRoomComplete() {
            if(STATE.roomProgress.tulip && STATE.roomProgress.letter && STATE.roomProgress.diary) {
                setTimeout(() => {
                    DOM.roomScene.style.opacity = 0;
                    setTimeout(() => {
                        DOM.roomScene.classList.remove('visible');
                        renderEndingOverlay('3_final');
                    }, 1500);
                }, 1000);
            }
        }

        /* --- SECRET MODAL (ENDING 4) --- */
        function triggerSecretModal() {
            STATE.isEnding = true; // Temporary lock
            const L = getLang();
            DOM.secretModal.classList.add('visible');
            const qBox = document.getElementById('secret-text');
            const btn = document.getElementById('btn-secret-yes');
            btn.style.display = 'none';

            const seq = () => {
                if(i < L.secret_q.length) {
                    qBox.innerText = L.secret_q[i++];

        /* --- UTILS --- */
        let typeTimer;
        function startTypewriter(lines) {
            let l = 0, c = 0;
            const el = DOM.endText;
            el.innerText = "";
            
            function type() {
                if(l >= lines.length) return;
                el.innerText = lines[l].substring(0, c);
                c++;
                if(c > lines[l].length) {
                    setTimeout(() => { l++; c=0; type(); }, 1200);
                } else {
                    typeTimer = setTimeout(type, 50);
                }
            }
            type();
            el.onclick = () => {
                clearTimeout(typeTimer);
                el.innerText = lines[l];
                setTimeout(() => { l++; c=0; type(); }, 500);
            };
        }

            localStorage.removeItem(CONFIG.STORAGE_KEY);

        function createParticles() {
            for(let i=0; i<20; i++) {
                const p = document.createElement('div');
                p.className = 'heart-particle';
                p.innerText = "❤";
                p.style.left = Math.random()*100+'vw';
                p.style.animationDuration = (Math.random()*5+5)+'s';
                p.style.fontSize = (Math.random()*20+10)+'px';
                document.getElementById('particles-container').appendChild(p);
            }
        }
        
        function spawnFloatingHeart(el) {
            const h = document.createElement('div'); h.innerText="💖"; 
            h.style.position='fixed'; h.style.left=el.getBoundingClientRect().left+'px'; h.style.top=el.getBoundingClientRect().top+'px';
            h.style.transition='1s'; h.style.zIndex='100'; document.body.appendChild(h);
            requestAnimationFrame(()=>{ h.style.transform='translate(0,-100px)'; h.style.opacity='0'; });
            setTimeout(()=>h.remove(),1000);
        }

        function showTooltip(msg) {
            const t = document.createElement('div'); t.innerText = msg;
            t.style.position='fixed'; t.style.top='20%'; t.style.left='50%'; t.style.transform='translate(-50%)';
            t.style.background='rgba(0,0,0,0.7)'; t.style.color='white'; t.style.padding='10px'; t.style.borderRadius='10px';
            document.body.appendChild(t); setTimeout(()=>t.remove(), 1500);
        }

        function startConfetti() {
            const c=document.getElementById('confetti-canvas'), x=c.getContext('2d');
            c.width=window.innerWidth; c.height=window.innerHeight;
            const p=[]; for(let i=0;i<100;i++) p.push({x:Math.random()*c.width,y:-10,c:['gold','pink','white'][Math.floor(Math.random()*3)],s:Math.random()*5+2});
            function draw(){ if(!STATE.isEnding) return; x.clearRect(0,0,c.width,c.height); p.forEach(o=>{x.fillStyle=o.c;x.fillRect(o.x,o.y,o.s,o.s);o.y+=o.s;if(o.y>c.height)o.y=-10}); requestAnimationFrame(draw); }
            draw();
        }

        /* --- STAGE EFFECTS (KEEPING OLD LOGIC) --- */
        const EffectGen = {
            static: () => ({ init: ()=>{} }),
            wiggle: (i) => ({ init: ()=>{ DOM.yesBtn.style.position='relative'; let t=0; const l=()=>{ if(STATE.yesCount>15)return; DOM.yesBtn.style.transform=`translate(${Math.sin(t++)*i}px,0)`; requestAnimationFrame(l); }; l(); } }),
            run: () => ({ init: ()=>{ DOM.yesBtn.style.position='absolute'; DOM.yesBtn.onmouseenter=()=>{ DOM.yesBtn.style.left=Math.random()*80+'%'; DOM.yesBtn.style.top=Math.random()*80+'%'; } } }),
            clone: () => { for(let i=0;i<5;i++){ const b=DOM.yesBtn.cloneNode(true); b.className='game-btn btn-yes fake-btn'; b.style.left=Math.random()*80+'%'; b.style.top=Math.random()*80+'%'; b.onclick=()=>{SFX.playNo();handleNo();b.remove()}; document.getElementById('fake-container').appendChild(b); } }
        };

        function generateStages() {
            STATE.effects = [];
            for(let i=0; i<102; i++) {
                if(i<10) STATE.effects.push(EffectGen.static());
                else if(i<20) STATE.effects.push(EffectGen.wiggle(2));
                else if(i<30) STATE.effects.push(EffectGen.run());
                else if(i<40) STATE.effects.push({init:()=>DOM.yesBtn.style.opacity=0.5});
                else if(i<50) STATE.effects.push({init:()=>EffectGen.clone()});
                else STATE.effects.push(EffectGen.static());
            }
        }

        function applyCurrentStage() {
            if(STATE.yesCount >= 100) return; 
            // Reset btn style
            DOM.yesBtn.style.position='relative'; DOM.yesBtn.style.left='auto'; DOM.yesBtn.style.top='auto'; DOM.yesBtn.style.opacity=1; DOM.yesBtn.onmouseenter=null;
            document.getElementById('fake-container').innerHTML = "";
            
            const ef = STATE.effects[STATE.yesCount];
            if(ef && ef.init) ef.init();
        }

        function saveGame() { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify({yes: STATE.yesCount, no: STATE.noCount, click: STATE.scoreClicked, room: STATE.roomProgress})); }
        function loadGame() {
            const d = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));
            if(d) { STATE.yesCount=d.yes||0; STATE.noCount=d.no||0; STATE.scoreClicked=d.click||false; STATE.roomProgress=d.room||{tulip:false,letter:false,diary:false}; if(STATE.yesCount>0) STATE.inLobby=false; }
        }
        function saveSettings() { localStorage.setItem(CONFIG.SETTINGS_KEY, JSON.stringify(SETTINGS)); }
        function loadSettings() { const s=JSON.parse(localStorage.getItem(CONFIG.SETTINGS_KEY)); if(s) SETTINGS=s; }

    </script>
</body>
</html>
